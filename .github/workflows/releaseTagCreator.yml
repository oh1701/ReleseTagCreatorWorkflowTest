name: Release Tag Creator

on:
 pull_request:
    types:
      - closed
    branches:
      - master
      
permissions:
  contents: write 
  
jobs:
  Base-branch-tag:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          
      - name: Fetch Base And Head
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }}
          git fetch origin ${{ github.event.pull_request.head.sha }}
          echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV
          echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          
      - name: Checkout Base Branch
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          
      - name: extract Version Name
        run: |
          echo "앱 버전 정보를 가져오는중 .."
          PR_VERSION_NAME=$(grep -oP '(?<=versionName\s=\s").*?(?=")' app/build.gradle.kts)
          echo "PR_VERSION_NAME=$PR_VERSION_NAME" >> $GITHUB_ENV

      - name: Generate Tag Body (Commits)
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          # Base Branch Log 및 Head Branch Log 가져오기 (병합 당시)
          # --no-merges 로 merge Commit 은 필터링, oneline 으로 커밋 로그를 한 줄로 요약하여 출력 
          CHANGES=$(git log --oneline --no-merges ${{ env.BASE_SHA }}..${{ env.HEAD_SHA }} )
          # 커밋 내역 각 줄 앞에 - 생성
          CHANGES=$(echo "$CHANGES" | sed 's/^/- /')
          RELEASE_BODY="## What's Changed"$'\n'"$CHANGES"
          {
            echo "RELEASE_BODY<<$EOF"
            echo "$RELEASE_BODY"
            echo "$EOF"
          } >> $GITHUB_ENV

      - name: Generate Release Tag
        uses: actions/create-release@v1
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          tag_name: Release/${{ env.PR_VERSION_NAME }} 
          release_name: Release ${{ env.PR_VERSION_NAME }} 
          body: ${{ env.RELEASE_BODY }}
